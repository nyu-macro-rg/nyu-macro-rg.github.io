# ============================================================================
#  THE ONLY FILE YOU NEED TO EDIT.
#  To add a session: copy the block above it, change the four lines, save.
#  See README.md, section "How to add a session".
#
#  Fields, per session:
#    date        required, YYYY-MM-DD
#    presenter   who is presenting
#    authors     the paper's authors (omit if the presenter wrote it)
#    title       the paper's title
#    paper_url   link to the paper (NBER / SSRN / journal / author's page)
#    slides      path to a PDF in files/slides/, or leave it out
#    status      leave out for a normal session. Or: tbd | cancelled | break
#    note        a short line shown in grey, e.g. why it was cancelled
# ============================================================================

meta:
