# ============================================================================
#  THE ONLY FILE YOU NEED TO EDIT.
#  To add a session: copy the block above it, change the four lines, save.
#  See README.md, section "How to add a session".
#
#  Fields, per session:
#    date        required, YYYY-MM-DD
#    presenter   who is presenting
#    authors     the paper's authors (omit if the presenter wrote it)
#    title       the paper's title
#    paper_url   link to the paper (NBER / SSRN / journal / author's page)
#    slides      path to a PDF in files/slides/, or leave it out
#    status      leave out for a normal session. Or: tbd | cancelled | break
#    note        a short line shown in grey, e.g. why it was cancelled
# ============================================================================

meta:
  title: "Boar-Gertler-Gilchrist-Midrigan-Peter Macro Reading Group"
  short_title: "NYU Macro Reading Group"
  blurb: "A student-run reading group in macroeconomics at NYU. We meet weekly during term to discuss a recent working paper, usually presented by a student."
  location: "19 W 4th St., Room 736"
  organizer:
    name: "Ariana Gamero"
    email: "ag11136@nyu.edu"
  archive_note: "Sessions from Fall 2019 onward are listed under Past sessions. Papers and slides from before Fall 2025 are still hosted on the group's previous site."
  archive_url: "https://sites.google.com/nyu.edu/bggmrg/home"

