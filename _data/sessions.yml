  short_title: "NYU Macro Reading Group"
  blurb: "A student-run reading group in macroeconomics at NYU. We meet weekly during term to discuss a recent working paper, usually presented by a student."
  location: "19 W 4th St., Room 736"
  organizer:
    name: "Ariana Gamero"
    email: "ag11136@nyu.edu"
  archive_note: "Sessions before Fall 2025 are archived on the group's previous site."
  archive_url: "https://sites.google.com/nyu.edu/bggmrg/home"

